<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicios Fetch API</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 30px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    img {
      width: 60px;
    }
    button {
      margin: 10px 0;
      padding: 8px 12px;
      cursor: pointer;
    }
    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Ejercicios Fetch API</h1>

  <!-- EJERCICIO 1-->
  <h2>Ejercicio 1: Equipo Pokémon</h2>
  <button id="btnPokemon">Cargar equipo Pokémon</button>

  <table>
    <thead>
      <tr>
        <th>Imagen</th>
        <th>Nombre</th>
        <th>Experiencia Base</th>
      </tr>
    </thead>
    <tbody id="pokemonTable"></tbody>
  </table>

  <!-- EJERCICIO 2 -->
  <h2>Ejercicio 2: Catálogo de Productos</h2>
  <button id="btnProductos">Cargar productos</button>
  <button id="btnFiltrar">Filtrar por stock bajo</button>

  <table>
    <thead>
      <tr>
        <th>Título</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Marca</th>
      </tr>
    </thead>
    <tbody id="productsTable"></tbody>
  </table>

  <!-- EJERCICIO 3 -->
  <h2>Ejercicio 3: Buscador de Productos</h2>
  <input type="text" id="searchInput" placeholder="Buscar producto...">
  <button id="btnBuscar">Buscar</button>

  <p id="searchError" class="error"></p>

  <table>
    <thead>
      <tr>
        <th>Imagen</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Descuento</th>
      </tr>
    </thead>
    <tbody id="searchTable"></tbody>
  </table>

<script>
/* EJERCICIO 1 */
const pokemonIds = [1, 4, 7];
const pokemonTable = document.getElementById("pokemonTable");

document.getElementById("btnPokemon").addEventListener("click", async () => {
  pokemonTable.innerHTML = "";

  for (const id of pokemonIds) {
    const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
    const data = await response.json();

    const row = document.createElement("tr");
    row.innerHTML = `
      <td><img src="${data.sprites.front_default}"></td>
      <td>${data.name}</td>
      <td>${data.base_experience}</td>
    `;
    pokemonTable.appendChild(row);
  }
});

/* EJERCICIO 2 */
let productos = [];
const productsTable = document.getElementById("productsTable");

async function cargarProductos() {
  const response = await fetch("https://dummyjson.com/products");
  const data = await response.json();
  productos = data.products;
  pintarProductos(productos);
}

function pintarProductos(lista) {
  productsTable.innerHTML = "";
  lista.forEach(producto => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${producto.title}</td>
      <td>${producto.price} €</td>
      <td>${producto.stock}</td>
      <td>${producto.brand}</td>
    `;
    productsTable.appendChild(row);
  });
}

document.getElementById("btnProductos").addEventListener("click", cargarProductos);

document.getElementById("btnFiltrar").addEventListener("click", () => {
  const stockBajo = productos.filter(p => p.stock < 10);
  pintarProductos(stockBajo);
});

/* <EJERCICIO 3 */
const searchTable = document.getElementById("searchTable");
const searchError = document.getElementById("searchError");

document.getElementById("btnBuscar").addEventListener("click", async () => {
  const valor = document.getElementById("searchInput").value;
  searchTable.innerHTML = "";
  searchError.textContent = "";

  const response = await fetch(`https://dummyjson.com/products/search?q=${valor}`);
  const data = await response.json();

  if (data.products.length === 0) {
    searchError.textContent = "No se encontraron productos que coincidan con tu búsqueda";
    return;
  }

  data.products.forEach(producto => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td><img src="${producto.thumbnail}"></td>
      <td>${producto.title}</td>
      <td>${producto.description}</td>
      <td>${producto.discountPercentage}%</td>
    `;
    searchTable.appendChild(row);
  });
});
</script>

</body>
</html>
